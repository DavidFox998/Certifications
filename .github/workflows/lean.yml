name: Lean proof build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: lake build (Morning Star certification source)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout the certified Lean source
        run: git clone --depth 1 https://github.com/DavidFox998/morningstar-project.git proof-source

      - name: Install elan
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < proof-source/lean-toolchain)"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache and build the certified Lean source
        working-directory: proof-source
        run: lake exe cache get && lake build